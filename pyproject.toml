[project]
name = "megatravelos"
version = "0.2.0"
description = "Seyahat arşivinden toplu Reels / Shorts / TikTok üreten pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyyaml>=6",
    "pillow>=10",
    "pillow-heif>=0.16",
    "numpy>=1.24",
    "tqdm>=4.66",
    "faster-whisper>=1.0",
    "ollama>=0.4",
]

[project.optional-dependencies]
# İsteğe bağlı: Claude API backend'i (varsayılan her şey lokal ve ücretsiz)
claude = ["anthropic>=0.40"]
# macOS Photos kütüphanesinden (shared album dahil) okuma
photos = ["osxphotos>=0.68"]
# Ses olayları (kahkaha, alkış, çığlık...) - YAMNet tflite
audio-events = ["ai-edge-litert>=1.0"]
# Klasör modunda GPS -> şehir (offline)
geo = ["reverse_geocoder>=1.5"]

[project.scripts]
mtos = "mtos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mtos"]
